AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: POC v2 - Dual-field reindex with ECS for heavy tasks, Lambda for light
  tasks
Parameters:
  CollectionEndpoint:
    Type: String
    Description: AOSS collection endpoint URL
  ECSImageUri:
    Type: String
    Description: ECR image URI for ECS tasks (build and push Dockerfile first)
  SubnetIds:
    Type: CommaDelimitedList
    Description: Subnet IDs for Fargate tasks (must have internet access for AOSS/S3)
  ECSTaskCpu:
    Type: String
    Default: '1024'
    Description: ECS task CPU (1024 = 1 vCPU)
  ECSTaskMemory:
    Type: String
    Default: '2048'
    Description: ECS task memory in MB
Globals:
  Function:
    Runtime: python3.12
    Timeout: 900
    MemorySize: 512
    Environment:
      Variables:
        ENCRYPTION_KEY: shanghaiopensearchFINETUNETASK
Resources:
  EmbeddingDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: reindex-ecs-data-${AWS::AccountId}-${AWS::Region}
      LifecycleConfiguration:
        Rules:
        - Id: CleanupAfter7Days
          Status: Enabled
          ExpirationInDays: 7
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: reindex-cluster
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reindex-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
      - PolicyName: CloudWatchLogsCreateGroup
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: logs:CreateLogGroup
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/*
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reindex-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: AOSSAndS3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aoss:APIAccessAll
            Resource: '*'
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
            Resource:
            - Fn::GetAtt:
              - EmbeddingDataBucket
              - Arn
            - Fn::Sub: ${EmbeddingDataBucket.Arn}/*
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: reindex-task
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu:
        Ref: ECSTaskCpu
      Memory:
        Ref: ECSTaskMemory
      ExecutionRoleArn:
        Fn::GetAtt:
        - ECSTaskExecutionRole
        - Arn
      TaskRoleArn:
        Fn::GetAtt:
        - ECSTaskRole
        - Arn
      ContainerDefinitions:
      - Name: main
        Image:
          Ref: ECSImageUri
        Essential: true
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group:
              Fn::Sub: /ecs/reindex-task
            awslogs-region:
              Ref: AWS::Region
            awslogs-stream-prefix: ecs
            awslogs-create-group: 'true'
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: reindex-sagemaker-execution-role-ecs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: sagemaker.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
      - PolicyName: S3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:ListBucket
            Resource:
            - Fn::GetAtt:
              - EmbeddingDataBucket
              - Arn
            - Fn::Sub: ${EmbeddingDataBucket.Arn}/*
  PrepareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reindex-ecs-prepare
      Handler: handler.handler
      CodeUri: PrepareFunction
      Policies:
      - Statement:
        - Effect: Allow
          Action: aoss:APIAccessAll
          Resource: '*'
    Metadata:
      SamResourceId: PrepareFunction
  StartEmbeddingJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reindex-ecs-start-embedding-job
      Handler: handler.handler
      CodeUri: StartEmbeddingJobFunction
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - sagemaker:CreateTrainingJob
          - sagemaker:DescribeTrainingJob
          Resource: '*'
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          Resource:
            Fn::Sub: ${EmbeddingDataBucket.Arn}/*
        - Effect: Allow
          Action: iam:PassRole
          Resource:
            Fn::GetAtt:
            - SageMakerExecutionRole
            - Arn
    Metadata:
      SamResourceId: StartEmbeddingJobFunction
  CheckEmbeddingJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reindex-ecs-check-embedding-job
      Handler: handler.handler
      CodeUri: CheckEmbeddingJobFunction
      Timeout: 60
      Policies:
      - Statement:
        - Effect: Allow
          Action: sagemaker:DescribeTrainingJob
          Resource: '*'
    Metadata:
      SamResourceId: CheckEmbeddingJobFunction
  CompletenessCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reindex-ecs-completeness-check
      Handler: handler.handler
      CodeUri: CompletenessCheckFunction
      Policies:
      - Statement:
        - Effect: Allow
          Action: aoss:APIAccessAll
          Resource: '*'
    Metadata:
      SamResourceId: CompletenessCheckFunction
  SwitchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reindex-ecs-switch
      Handler: handler.handler
      CodeUri: SwitchFunction
      Policies:
      - Statement:
        - Effect: Allow
          Action: aoss:APIAccessAll
          Resource: '*'
    Metadata:
      SamResourceId: SwitchFunction
  ReindexStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: DualFieldReindexECS
      DefinitionUri: ../../statemachine/reindex.asl.json
      DefinitionSubstitutions:
        PrepareFunctionArn:
          Fn::GetAtt:
          - PrepareFunction
          - Arn
        StartEmbeddingJobFunctionArn:
          Fn::GetAtt:
          - StartEmbeddingJobFunction
          - Arn
        CheckEmbeddingJobFunctionArn:
          Fn::GetAtt:
          - CheckEmbeddingJobFunction
          - Arn
        CompletenessCheckFunctionArn:
          Fn::GetAtt:
          - CompletenessCheckFunction
          - Arn
        SwitchFunctionArn:
          Fn::GetAtt:
          - SwitchFunction
          - Arn
        ECSClusterArn:
          Fn::GetAtt:
          - ECSCluster
          - Arn
        ECSTaskDefinitionArn:
          Ref: ECSTaskDefinition
        SubnetIds:
          Fn::Join:
          - '","'
          - Ref: SubnetIds
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: PrepareFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: StartEmbeddingJobFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CheckEmbeddingJobFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CompletenessCheckFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: SwitchFunction
      - Statement:
        - Effect: Allow
          Action:
          - ecs:RunTask
          - ecs:StopTask
          - ecs:DescribeTasks
          Resource: '*'
        - Effect: Allow
          Action: iam:PassRole
          Resource:
          - Fn::GetAtt:
            - ECSTaskExecutionRole
            - Arn
          - Fn::GetAtt:
            - ECSTaskRole
            - Arn
        - Effect: Allow
          Action:
          - events:PutTargets
          - events:PutRule
          - events:DescribeRule
          Resource:
            Fn::Sub: arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule
Outputs:
  StateMachineArn:
    Value:
      Ref: ReindexStateMachine
  ECSClusterArn:
    Value:
      Fn::GetAtt:
      - ECSCluster
      - Arn
  ECSTaskDefinitionArn:
    Value:
      Ref: ECSTaskDefinition
  EmbeddingDataBucketName:
    Value:
      Ref: EmbeddingDataBucket
  SageMakerRoleArn:
    Value:
      Fn::GetAtt:
      - SageMakerExecutionRole
      - Arn
